plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.gioacchinobriguglio.damaescacchi'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.gioacchinobriguglio.damaescacchi'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
