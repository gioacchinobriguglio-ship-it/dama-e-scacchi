name: Android build

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Build bundle (Play Store) e APK di prova
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon bundleRelease assembleDebug 2>&1 | tee build.log

      - name: Pubblica i file nel ramo android-dist
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp app/build/outputs/bundle/release/*.aab out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA} $(date -u)" > out/STATUS.txt
          cd out
          git init -q
          git checkout -q -b android-dist
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-dist
